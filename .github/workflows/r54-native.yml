name: R54 builtin arity matrix and raw bounds
on:
  push:
    branches: [feature/r54-builtin-arity-bounds-20261012]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: NASM without elevation
        run: |
          cd "$RUNNER_TEMP"
          apt download nasm
          mkdir -p tools
          for p in ./*.deb; do dpkg-deb -x "$p" tools; done
          echo "$RUNNER_TEMP/tools/usr/bin" >> "$GITHUB_PATH"
      - name: Build accepted R46 and R54 native compilers
        run: |
          git show 72b824f70049765c3977db07d712a1a604b89434:src/sutram_compiler.asm >/tmp/r46.asm
          nasm -f elf64 -I. /tmp/r46.asm -o /tmp/r46.o
          ld -o r48_before /tmp/r46.o
          nasm -f elf64 -I. src/sutram_compiler.asm -o /tmp/r54.o
          ld -o r48_after /tmp/r54.o
      - name: All registered builtin signatures, native executable and diagnostic checks
        run: python3 tools/r54_native_acceptance.py
      - name: Prior accepted native compatibility checks
        run: |
          python3 tools/r48_native_acceptance.py
          python3 tools/r48_stage2_acceptance.py
          python3 tools/r49_repeated_semantic.py
          python3 tools/r49_diagnostic_audit.py
          python3 tools/r51_native_audit.py
          python3 tools/r51_graph_inventory.py
          python3 tools/r50_native_acceptance.py
          git show 853083c9762992757b8f6682e5b3a3fc7296d8bf:src/sutram_compiler.asm >/tmp/old.asm
          nasm -f elf64 -I. /tmp/old.asm -o /tmp/old.o
          ld -o r52_before /tmp/old.o
          python3 tools/r52_native_acceptance.py
      - name: Full accepted tests without rewriting goldens
        run: |
          cp r48_after sutram_compiler
          python3 tests/run_tests.py
          python3 tools/codegen_gate.py
          python3 tools/test_lang_packs.py
          python3 -m unittest discover -s tests/module_graph -p 'test_*.py' -v
      - name: Check GUI and historical output files unchanged
        run: |
          git diff --exit-code 53d9b6f14f832a6d4b962fbe6f303983895782cb -- ide/ tests/expect/ win/winrt.inc
          echo R54_GUI_GOLDENS_UNCHANGED_PASS
      - name: SHA256 evidence
        if: always()
        run: |
          sha256sum src/sutram_compiler.asm tools/r54_native_acceptance.py tests/r54_check/*.sm .github/workflows/r54-native.yml > r54_sha256.txt
          cat r54_sha256.txt
      - name: Upload checksum
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r54-native-sha256
          path: r54_sha256.txt
