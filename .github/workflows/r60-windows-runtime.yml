name: R60 genuine Windows desktop probe (no installer side-effects)
on:
  push:
    branches: [feature/r60-windows-smoke-20261014]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Source-build Win64 GUI (no C framework)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if (-not (Get-Command nasm.exe -ErrorAction SilentlyContinue)) {
            choco install nasm --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Chocolatey NASM acquisition failed on ephemeral test runner.' }
          }
          $env:PATH = "C:\Program Files\NASM;C:\msys64\ucrt64\bin;C:\msys64\mingw64\bin;C:\ProgramData\chocolatey\bin;" + $env:PATH
          Get-Command nasm.exe
          Get-Command ld.exe
          & .\windows\gui\build-gui.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Win64 source GUI failed to assemble/link.' }
          (Get-FileHash .\sutram-ide-gui.exe -Algorithm SHA256).Hash

      - name: Confirm Windows host and uploaded binary hashes
        shell: pwsh
        run: |
          Write-Host "RUNNER_OS=$env:RUNNER_OS"
          [Environment]::OSVersion.VersionString
          Get-FileHash -Algorithm SHA256 "Sarvam-to-ChatGPT/Sutram-Setup.exe"
          Get-FileHash -Algorithm SHA256 "Sarvam-to-ChatGPT/sutram-windows-idle-test.zip"
          Get-FileHash -Algorithm SHA256 "icons/sutram.ico"
      - name: Run executable GUI and installer window probe on real Windows
        shell: powershell
        run: |
          powershell.exe -NoProfile -File tools/r60_windows_desktop_probe.ps1 -ResultsDir "$env:RUNNER_TEMP\sutram-r60"
      - name: Static Windows GUI unit checks (UTF-8 text, not cp1252)
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          python -m unittest discover -s tests/gui -p "test_*.py" -v
      - name: Native Win32 RichEdit compile-and-run plus shell smoke
        shell: powershell
        run: |
          powershell.exe -NoProfile -File tools/r60_native_win32_smoke.ps1 -Exe "$env:RUNNER_TEMP\sutram-r60\idle-test\sutram-ide-gui.exe" -ResultsDir "$env:RUNNER_TEMP\sutram-r60"
      - name: Upload screenshot and exact Windows result logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r60-windows-desktop-evidence
          path: ${{ runner.temp }}/sutram-r60/
          if-no-files-found: warn
      - name: Display source checksums
        if: always()
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 tools/r60_windows_desktop_probe.ps1
