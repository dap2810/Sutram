name: R59 safe pre-emission no-op proof
# Run only when intentionally requested. Do not launch another full
# verification job for each small source or evidence commit: that created
# repeated failed CI notifications while independent blockers were under review.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Acquire NASM without root installation
        run: |
          cd "$RUNNER_TEMP"
          apt download nasm
          mkdir -p nasm-tools
          for p in ./*.deb; do dpkg-deb -x "$p" nasm-tools; done
          echo "$RUNNER_TEMP/nasm-tools/usr/bin" >> "$GITHUB_PATH"
      - name: Build accepted R57/R58/R59 baseline compilers
        run: |
          git show 3631070a47bacabe25e9e78359daceb178301510:src/sutram_compiler.asm >/tmp/r57-before.asm
          nasm -f elf64 -I. /tmp/r57-before.asm -o /tmp/r57-before.o
          ld -o r57_before /tmp/r57-before.o
          git show 29e7c106ca29533da5a5c3ef5a54ae40b82e0a15:src/sutram_compiler.asm >/tmp/r58-before.asm
          nasm -f elf64 -I. /tmp/r58-before.asm -o /tmp/r58-before.o
          ld -o r58_before /tmp/r58-before.o
          git show e5dc8ac7571cfd4d2c10dfc51fce13f709e82443:src/sutram_compiler.asm >/tmp/r59-before.asm
          nasm -f elf64 -I. /tmp/r59-before.asm -o /tmp/r59-before.o
          ld -o r59_before /tmp/r59-before.o
          nasm -f elf64 -I. src/sutram_compiler.asm -o /tmp/r57.o
          ld -o r48_after /tmp/r57.o
          git show 72b824f70049765c3977db07d712a1a604b89434:src/sutram_compiler.asm >/tmp/r46.asm
          nasm -f elf64 -I. /tmp/r46.asm -o /tmp/r46.o
          ld -o r48_before /tmp/r46.o
          git show 4f294f7728e8fd86dc5c3c01335d30162b0d92ad:src/sutram_compiler.asm >/tmp/r55-before.asm
          nasm -f elf64 -I. /tmp/r55-before.asm -o /tmp/r55-before.o
          ld -o r55_before /tmp/r55-before.o
          git show 53d9b6f14f832a6d4b962fbe6f303983895782cb:src/sutram_compiler.asm >/tmp/oldraw.asm
          nasm -f elf64 -I. /tmp/oldraw.asm -o /tmp/oldraw.o
          ld -o r54_before /tmp/oldraw.o
          git show 853083c9762992757b8f6682e5b3a3fc7296d8bf:src/sutram_compiler.asm >/tmp/r52-before.asm
          nasm -f elf64 -I. /tmp/r52-before.asm -o /tmp/r52-before.o
          ld -o r52_before /tmp/r52-before.o
      - name: R59 native stdout plus decoded x86 instructions and timing
        run: python3 tools/r59_native_acceptance.py
      - name: R58 native correctness and three benchmarks
        run: python3 tools/r58_native_acceptance.py
      - name: R57 accepted fixture stdout and old/new baseline
        run: |
          python3 tools/r57_native_acceptance.py
          SUTRAM_COMPILER="$(pwd)/r58_before" python3 tools/r57_codegen_baseline.py
      - name: R56 global variables (native ELF and static PE)
        run: python3 tools/r56_native_acceptance.py
      - name: R55 prototypes preserved
        env:
          R56_GLOBALS_ACCEPTED: "1"
        run: python3 tools/r55_native_acceptance.py
      - name: Historic compile/diagnostic acceptance without old binary identity
        run: |
          python3 tools/r54_native_acceptance.py
          python3 tools/r48_stage2_acceptance.py
          python3 tools/r49_repeated_semantic.py
          python3 tools/r49_diagnostic_audit.py
          python3 tools/r51_native_audit.py
          python3 tools/r51_graph_inventory.py
          python3 tools/r50_native_acceptance.py
          python3 tools/r52_native_acceptance.py
      - name: All native goldens, codegen gates, language packs and module graph
        run: |
          cp r48_after sutram_compiler
          python3 tools/r54_muse_acceptance.py
          python3 tools/codegen_gate.py
          python3 tools/test_lang_packs.py
          python3 -m unittest discover -s tests/module_graph -p 'test_*.py' -v
      - name: R57 baseline remains frozen in accepted R57 compiler
        run: SUTRAM_COMPILER="$(pwd)/r58_before" python3 tools/r57_codegen_baseline.py
      - name: Verify proposed R58 frozen generated-ELF hashes
        run: python3 tools/r58_codegen_baseline.py
      - name: Verify proposed R59 frozen codegen image hashes
        run: python3 tools/r59_codegen_baseline.py
      - name: Standard library fixed and property proofs
        run: |
          python3 tools/proof_lib.py --compiler "$(pwd)/r48_after"
          python3 tools/proof_props.py --compiler "$(pwd)/r48_after"
      - name: Confirm accepted goldens and GUI untouched
        run: |
          git diff --exit-code e5dc8ac7571cfd4d2c10dfc51fce13f709e82443 -- tests/expect/ ide/ win/ windows/
          echo R59_GUI_GOLDENS_UNCHANGED
      - name: SHA-256 actual source manifest
        if: always()
        run: |
          sha256sum src/sutram_compiler.asm tools/r59_native_acceptance.py tools/r59_codegen_baseline.py docs/R59-PREEMISSION-PEEPHOLE.md tests/r59_check/* .github/workflows/r59-native.yml > r59_sha256.txt
          cat r59_sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r59-native-provenance
          path: r59_sha256.txt
