name: R45 Baseline Performance and Profiling
on:
  push:
    branches: [feature/r45-measured-compiler-performance-20261009]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Acquire NASM as non-root user
        run: |
          mkdir -p "$RUNNER_TEMP/nasm-user"
          cd "$RUNNER_TEMP"
          apt download nasm
          dpkg-deb -x nasm_*.deb "$RUNNER_TEMP/nasm-user"
          echo "$RUNNER_TEMP/nasm-user/usr/bin" >> "$GITHUB_PATH"
      - name: Build Linux ELF profiling compiler
        run: |
          mkdir -p win
          if test ! -f win/rtblob.inc; then
            printf 'RT_BLOB_LEN equ 0\nRT_SYSCALL_OFF equ 0\nrt_blob: db 0\n' > win/rtblob.inc
          fi
          # Same instrumentation in both baselines: commit predates only the ELF
          # header write optimization, and is a parent of the current HEAD.
          git show 7434104529280bcab7657cef818955019951f7d6:src/sutram_compiler.asm > /tmp/r45_before.asm
          nasm -f elf64 -I. -dR45_PROFILE /tmp/r45_before.asm -o /tmp/r45_before.o
          nasm -f elf64 -I. -dR45_PROFILE src/sutram_compiler.asm -o /tmp/r45_after.o
          ld -o r45_before_compiler /tmp/r45_before.o
          ld -o r45_after_compiler /tmp/r45_after.o
          # Build actual release binary WITHOUT optional R45_PROFILE instrumentation.
          nasm -f elf64 -I. src/sutram_compiler.asm -o /tmp/r45_release.o
          ld -o r45_release_compiler /tmp/r45_release.o
          ./r45_before_compiler --version
          ./r45_after_compiler --version
          ./r45_release_compiler --version
      - name: Interleaved A/B native benchmarks
        run: |
          python3 tools/r45_benchmark.py --compiler ./r45_before_compiler --other ./r45_after_compiler --label baseline --runs 30 --warmup 5 --output r45_ab.csv
          echo "R45_RAW_CSV_START"
          cat r45_ab.csv
          echo "R45_RAW_CSV_END"
      - name: Check baseline regression suite and gates
        run: |
          cp r45_release_compiler sutram_compiler
          python3 tests/run_tests.py
          python3 tools/codegen_gate.py
          python3 tools/test_lang_packs.py
          python3 -m unittest discover -s tests/module_graph -p 'test_*.py' -v
      - name: Print exact source/workflow/timings SHA-256 for Sarvam
        if: always()
        run: |
          echo R45_SHA_START
          sha256sum src/sutram_compiler.asm tools/r45_benchmark.py .github/workflows/r45-profile.yml \
            ChatGPT-to-Sarvam/ROUND-45-RAW-AB-2026-10-09.csv \
            ChatGPT-to-Sarvam/ROUND-45-NASM-REVIEW.patch \
            ChatGPT-to-Sarvam/ROUND-45-HANDOFF-2026-10-09.md
          echo R45_SHA_END
          if test -f ChatGPT-to-Sarvam/ROUND-45-SHA256.txt; then
            sha256sum -c ChatGPT-to-Sarvam/ROUND-45-SHA256.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r45-interleaved-ab-raw
          path: r45_ab.csv
          if-no-files-found: warn
