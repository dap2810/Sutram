name: R45 native benchmark and profiler
on:
  push:
    branches:
      - feature/r45-measured-compile-performance-20261009
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install user-local NASM and strace
        run: |
          mkdir -p "$RUNNER_TEMP/r45-tools"
          cd "$RUNNER_TEMP"
          apt download nasm strace
          for f in nasm_*.deb strace_*.deb; do dpkg-deb -x "$f" "$RUNNER_TEMP/r45-tools"; done
          echo "$RUNNER_TEMP/r45-tools/usr/bin" >> "$GITHUB_PATH"
      - name: Supply missing PE blob only for native Linux host compiler
        run: |
          mkdir -p win
          if test ! -f win/rtblob.inc; then
            printf 'RT_BLOB_LEN equ 0\nRT_SYSCALL_OFF equ 0\nrt_blob: db 0\n' > win/rtblob.inc
          fi
      - name: Build accepted baseline and optimized candidate
        run: |
          git fetch --no-tags --depth=1 origin 4a929ea1f89b668bd3b3b9be7f97cfe08309982e
          git show 4a929ea1f89b668bd3b3b9be7f97cfe08309982e:src/sutram_compiler.asm > /tmp/r45_base.asm
          nasm -f elf64 -I. /tmp/r45_base.asm -o /tmp/r45_base.o
          ld -o /tmp/r45_base /tmp/r45_base.o
          nasm -f elf64 -I. src/sutram_compiler.asm -o /tmp/r45_new.o
          ld -o /tmp/r45_new /tmp/r45_new.o
          ln -s /tmp/r45_new sutram_compiler
          echo "R45 BASELINE SHA: $(sha256sum /tmp/r45_base.asm)"
          echo "R45 CANDIDATE SHA: $(sha256sum src/sutram_compiler.asm)"
      - name: Baseline and candidate syscall profiles
        run: |
          strace -f -c -o /tmp/r45_strace_A.txt /tmp/r45_base examples/163_r40_transitive_diamond.sm /tmp/r45_prof_A.bin
          strace -f -c -o /tmp/r45_strace_B.txt /tmp/r45_new examples/163_r40_transitive_diamond.sm /tmp/r45_prof_B.bin
          cmp /tmp/r45_prof_A.bin /tmp/r45_prof_B.bin
          echo "R45 PROFILE BASELINE"
          cat /tmp/r45_strace_A.txt
          echo "R45 PROFILE CANDIDATE"
          cat /tmp/r45_strace_B.txt
      - name: Paired baseline versus optimization with raw CSV
        run: |
          python3 tools/r45_benchmark.py --baseline /tmp/r45_base --candidate /tmp/r45_new --runs 61 --warmup 6 --csv /tmp/r45_compare.csv --summary /tmp/r45_compare.json
      - name: Existing native regression tests
        run: python3 tests/run_tests.py
      - name: Codegen gate
        run: python3 tools/codegen_gate.py
      - name: Language packs
        run: python3 tools/test_lang_packs.py
      - name: Module graph oracle
        run: python3 -m unittest discover -s tests/module_graph -p 'test_*.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: r45-interleaved-raw
          path: |
            /tmp/r45_compare.csv
            /tmp/r45_compare.json
            /tmp/r45_strace_A.txt
            /tmp/r45_strace_B.txt
          retention-days: 30
