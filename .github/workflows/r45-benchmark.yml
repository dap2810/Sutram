name: R45 native benchmark and profiler
on:
  push:
    branches:
      - feature/r45-measured-compile-performance-20261009
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install user-local NASM and strace
        run: |
          mkdir -p "$RUNNER_TEMP/r45-tools"
          cd "$RUNNER_TEMP"
          apt download nasm strace
          for f in nasm_*.deb strace_*.deb; do dpkg-deb -x "$f" "$RUNNER_TEMP/r45-tools"; done
          echo "$RUNNER_TEMP/r45-tools/usr/bin" >> "$GITHUB_PATH"
      - name: Supply missing PE blob only for native Linux host compiler
        run: |
          mkdir -p win
          if test ! -f win/rtblob.inc; then
            printf 'RT_BLOB_LEN equ 0\nRT_SYSCALL_OFF equ 0\nrt_blob: db 0\n' > win/rtblob.inc
          fi
      - name: Build accepted baseline and candidate
        run: |
          nasm -f elf64 -I. src/sutram_compiler.asm -o /tmp/r45_base.o
          ld -o /tmp/r45_base /tmp/r45_base.o
          cp /tmp/r45_base /tmp/r45_new
          ln -s /tmp/r45_base sutram_compiler
          echo "R45 BASELINE: $(sha256sum src/sutram_compiler.asm)"
      - name: Baseline profile (strace syscalls; advisory, includes tracer overhead)
        run: |
          strace -f -c -o /tmp/r45_strace.txt /tmp/r45_base examples/163_r40_transitive_diamond.sm /tmp/r45_strace_result.bin
          echo "R45 PROFILE START"
          cat /tmp/r45_strace.txt
          echo "R45 PROFILE END"
      - name: Baseline A/A noise floor and golden comparison
        run: |
          python3 tools/r45_benchmark.py --baseline /tmp/r45_base --candidate /tmp/r45_new --runs 31 --warmup 4 --csv /tmp/r45_aa.csv --summary /tmp/r45_aa.json
      - name: Existing native regression tests
        run: python3 tests/run_tests.py
      - name: Codegen gate
        run: python3 tools/codegen_gate.py
      - name: Language packs
        run: python3 tools/test_lang_packs.py
      - name: Module graph oracle
        run: python3 -m unittest discover -s tests/module_graph -p 'test_*.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: r45-baseline-raw
          path: |
            /tmp/r45_aa.csv
            /tmp/r45_aa.json
            /tmp/r45_strace.txt
          retention-days: 30
